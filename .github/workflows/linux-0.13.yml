name: linux-0.13
run-name: Linux 0.13 Tests
on:
  push:
    branches:
      - 0.13.x
    paths:
      - '**.zig'
      - '**.zon'
      - 'integration_tests/test_cases/**'
      - '.github/workflows/linux-0.13.yml'
  pull_request:
    paths:
      - '**.zig'
      - '**.zon'
      - 'integration_tests/test_cases/**'
      - '.github/workflows/linux-0.13.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    name: Test Linux 0.13
    timeout-minutes: 10
    steps:
      - name: "Checkout repo"
        uses: actions/checkout@v4
      - name: "Setup zig environment"
        uses: mlugg/setup-zig@v2.0.5
        with:
          version: 0.13.0
      - name: "Run unit tests"
        run: zig build unit-test
      - name: "Run linter"
        run: zig build lint
      - name: "Run integration tests"
        run: zig build integration-test
      - name: "Run integration check"
        run: zig build integration-check --summary all
